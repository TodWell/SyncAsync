[tox]
envlist = py311, py312, py313, py314
skip_missing_interpreters = true

[testenv]
extras = test
commands = pytest {posargs:tests/}

[testenv:py311]
basepython = python3.11

[testenv:py312]
basepython = python3.12

[testenv:py313]
basepython = python3.13

[testenv:py314]
basepython = python3.14
