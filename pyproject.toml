[project]
name = "sync-async"
version = "0.1.0"
description = "Interface for easy access to asynchronous methods for synchronous users"
authors = [{ name = "Tobias Duewell", email = "dev@duewell.ch" }]
readme = "README.md"
license = { text = "MIT" }
keywords = ["asynchronous", "api", "IPython", "accessibility"]
requires-python = ">=3.11"
dependencies = ["nest-asyncio>=1.5"]

[project.optional-dependencies]
test = [
    "pytest>=7.4.2",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["SyncAsync"]
